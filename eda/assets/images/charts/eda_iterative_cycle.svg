<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="auto" style="background:#FAF7F2; font-family:'Plus Jakarta Sans', -apple-system, sans-serif;">
  <defs>
    <filter id="cardShadow3" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2A2825" flood-opacity="0.06"/>
    </filter>
  </defs>

  <text x="440" y="32" text-anchor="middle" font-size="12" font-weight="800" fill="#D56638" letter-spacing="2">TOPIC 01 • WHY EDA IS NOT LINEAR</text>
  <text x="440" y="58" text-anchor="middle" font-size="20" font-weight="800" fill="#2A2825">The 7 Practitioner Steps: A Non-Linear Cycle of Questions</text>

  <!-- Cycle diagram container -->
  <g transform="translate(60, 80)">
    <!-- Central Insight Circle -->
    <circle cx="380" cy="180" r="85" fill="#FFFFFF" stroke="#D56638" stroke-width="2" filter="url(#cardShadow3)"/>
    <text x="380" y="165" text-anchor="middle" font-size="13" font-weight="800" fill="#D56638">EDA GOAL</text>
    <text x="380" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#2A2825">"Not final answers,</text>
    <text x="380" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#5A822B">but better questions."</text>

    <!-- STEP 1: CONTEXT -->
    <rect x="20" y="20" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#E8DFD1" filter="url(#cardShadow3)"/>
    <text x="35" y="42" font-size="11" font-weight="800" fill="#D56638">1. Context &amp; Source</text>
    <text x="35" y="60" font-size="10" fill="#5E5852">Who collected it? Why? How?</text>

    <!-- STEP 2: STRUCTURE -->
    <rect x="280" y="20" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#E8DFD1" filter="url(#cardShadow3)"/>
    <text x="295" y="42" font-size="11" font-weight="800" fill="#2A2825">2. Inspect Structure</text>
    <text x="295" y="60" font-size="10" fill="#5E5852">Shape, dtypes, dimensions, orientation.</text>

    <!-- STEP 3: QUALITY -->
    <rect x="540" y="20" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#E8DFD1" filter="url(#cardShadow3)"/>
    <text x="555" y="42" font-size="11" font-weight="800" fill="#D56638">3. Assess Quality</text>
    <text x="555" y="60" font-size="10" fill="#5E5852">Missingness, corrupt values, gaps.</text>

    <!-- STEP 4: INDIVIDUAL VARIABLES -->
    <rect x="540" y="150" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#E8DFD1" filter="url(#cardShadow3)"/>
    <text x="555" y="172" font-size="11" font-weight="800" fill="#5A822B">4. Individual Variables</text>
    <text x="555" y="190" font-size="10" fill="#5E5852">Skewness, spreads, medians, scales.</text>

    <!-- STEP 5: RELATIONSHIPS -->
    <rect x="540" y="280" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#E8DFD1" filter="url(#cardShadow3)"/>
    <text x="555" y="302" font-size="11" font-weight="800" fill="#2A2825">5. Variable Relationships</text>
    <text x="555" y="320" font-size="10" fill="#5E5852">Dependencies, scatter, correlations.</text>

    <!-- STEP 6: ANOMALIES -->
    <rect x="280" y="280" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#E8DFD1" filter="url(#cardShadow3)"/>
    <text x="295" y="302" font-size="11" font-weight="800" fill="#D56638">6. Spot Anomalies</text>
    <text x="295" y="320" font-size="10" fill="#5E5852">"Does this make sense? Why not?"</text>

    <!-- STEP 7: HYPOTHESES -->
    <rect x="20" y="280" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#E8DFD1" filter="url(#cardShadow3)"/>
    <text x="35" y="302" font-size="11" font-weight="800" fill="#5A822B">7. Formulate Questions</text>
    <text x="35" y="320" font-size="10" fill="#5E5852">Informed hypotheses for modeling.</text>

    <!-- Connecting Arrows -->
    <path d="M 220 50 L 275 50" stroke="#D56638" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 480 50 L 535 50" stroke="#D56638" stroke-width="2"/>
    <path d="M 640 80 L 640 145" stroke="#5A822B" stroke-width="2"/>
    <path d="M 640 210 L 640 275" stroke="#5A822B" stroke-width="2"/>
    <path d="M 540 310 L 485 310" stroke="#D56638" stroke-width="2"/>
    <path d="M 280 310 L 225 310" stroke="#D56638" stroke-width="2"/>
    <path d="M 120 280 L 120 85" stroke="#5A822B" stroke-width="2" stroke-dasharray="5,4"/>
  </g>
</svg>
